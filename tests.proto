syntax = "proto3";

message Lights {
  bool on = 3;
}

message Room {
  uint32 number = 1;
  Lights lights = 2;
  uint64 size = 3;
  sint32 altitude = 4;
  sint64 temperature = 5;
  int64 humidity = 6;
  int32 pressure = 7;
}

message Collection {
  string id                       =  1;
  repeated uint32 numbers_uint32  =  2 [packed = false];
  repeated uint64 numbers_uint64  =  3 [packed = false];
  repeated sint32 numbers_sint32  =  4 [packed = false];
  repeated sint64 numbers_sint64  =  5 [packed = false];
  repeated int32 numbers_int32    =  6 [packed = false];
  repeated int64 numbers_int64    =  7 [packed = false];
  repeated bool booleans          =  8 [packed = false];
  repeated string strings         =  9 [packed = false];
  repeated bytes bytess           = 10 [packed = false];
  repeated Room messages          = 11;
}

// Field numbers at the boundaries of tag lengths (1 to 5 bytes)
message VarintTags {
  uint32 f1         =         1;
  uint32 f15        =        15;
  uint32 f16        =        16;
  uint32 f2047      =      2047;
  uint32 f2048      =      2048;
  uint32 f262143    =    262143;
  uint32 f262144    =    262144;
  uint32 f33554431  =  33554431;
  uint32 f33554432  =  33554432;
  uint32 f536870911 = 536870911;
}

// Same as VarintTags but with a length-delimited type
message LenTags {
  string f1         =         1;
  string f15        =        15;
  string f16        =        16;
  string f2047      =      2047;
  string f2048      =      2048;
  string f262143    =    262143;
  string f262144    =    262144;
  string f33554431  =  33554431;
  string f33554432  =  33554432;
  string f536870911 = 536870911;
}
